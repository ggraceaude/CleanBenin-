<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CleanBenin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><a class="brand" href="{{ url_for('home') }}">CleanBenin 🧹</a><span>Propreté et sérénité</span></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="notice {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>CleanBenin · Service de nettoyage au Bénin</footer>
</body>
</html>
